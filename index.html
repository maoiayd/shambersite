<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منشئ الإعلانات الاحترافي</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700;900&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    font-family:'Cairo',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:1400px;
    display:grid;
    grid-template-columns:360px 1fr;
    gap:20px;
}

.panel{
    background:#111827;
    border-radius:30px;
    padding:25px;
    color:white;
    box-shadow:0 0 50px rgba(0,0,0,.4);
}

.panel h2{
    font-size:30px;
    margin-bottom:20px;
}

.upload{
    border:2px dashed #374151;
    border-radius:20px;
    padding:30px;
    text-align:center;
    cursor:pointer;
    transition:.3s;
    margin-bottom:20px;
}

.upload:hover{
    background:#1f2937;
}

.upload input{
    display:none;
}

textarea{
    width:100%;
    height:120px;
    resize:none;
    border:none;
    outline:none;
    border-radius:18px;
    padding:15px;
    background:#1f2937;
    color:white;
    font-size:18px;
    margin-bottom:20px;
}

.controls{
    display:grid;
    gap:15px;
    margin-bottom:20px;
}

.control-box{
    background:#1f2937;
    padding:15px;
    border-radius:18px;
}

.control-box label{
    display:block;
    margin-bottom:10px;
    font-weight:bold;
}

select,
input[type="color"]{
    width:100%;
    height:50px;
    border:none;
    border-radius:12px;
    background:#374151;
    color:white;
    padding:10px;
    font-size:16px;
}

button{
    width:100%;
    border:none;
    border-radius:18px;
    padding:16px;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

#createBtn{
    background:linear-gradient(45deg,#ff0055,#ff7b00);
}

#downloadBtn{
    background:linear-gradient(45deg,#00c853,#00e676);
    margin-top:15px;
}

button:hover{
    transform:translateY(-3px);
}

.editor{
    position:relative;
    overflow:hidden;
    border-radius:35px;
    background:#111;
    min-height:760px;
    box-shadow:0 0 60px rgba(0,0,0,.5);
}

.editor img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:
    brightness(.7)
    contrast(1.1)
    saturate(1.2);
}

.overlay{
    position:absolute;
    inset:0;

    background:
    linear-gradient(to top,
    rgba(0,0,0,.75),
    rgba(0,0,0,.15)),

    linear-gradient(to right,
    rgba(255,0,85,.2),
    transparent);
}

.glow{
    position:absolute;
    width:500px;
    height:500px;
    background:#ff0055;
    filter:blur(140px);
    opacity:.2;
    top:-120px;
    left:-120px;
}

.ad-text{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:5;

    width:80%;
    text-align:center;

    color:white;

    font-size:60px;
    font-weight:900;

    line-height:1.3;

    text-shadow:
    0 5px 25px rgba(0,0,0,.8),
    0 0 30px rgba(255,255,255,.15);

    animation:show .7s ease;
}

.badge{
    position:absolute;
    top:30px;
    left:30px;

    background:linear-gradient(45deg,#ff0055,#ff7b00);

    color:white;

    padding:12px 25px;

    border-radius:50px;

    font-weight:bold;

    z-index:10;
}

.toast{
    position:fixed;
    bottom:30px;
    right:30px;

    background:#00c853;
    color:white;

    padding:16px 28px;

    border-radius:18px;

    font-size:18px;
    font-weight:bold;

    opacity:0;
    transform:translateY(30px);

    transition:.4s;

    z-index:999;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

@keyframes show{

    from{
        opacity:0;
        transform:
        translate(-50%,-40%);
    }

    to{
        opacity:1;
        transform:
        translate(-50%,-50%);
    }

}

@media(max-width:900px){

.container{
    grid-template-columns:1fr;
}

.editor{
    min-height:500px;
}

.ad-text{
    font-size:36px;
}

}

</style>
</head>
<body>

<div class="container">

    <div class="panel">

        <h2>مصمم الإعلانات</h2>

        <label class="upload">

            <input type="file" id="imageInput" accept="image/*">

            <h3>ارفع صورة</h3>
            <p>اضغط لاختيار الصورة</p>

        </label>

        <textarea id="textInput"
        placeholder="اكتب نص الإعلان هنا..."></textarea>

        <div class="controls">

            <div class="control-box">

                <label>لون النص</label>

                <input type="color"
                id="colorPicker"
                value="#ffffff">

            </div>

            <div class="control-box">

                <label>نوع الخط</label>

                <select id="fontPicker">

                    <option value="Cairo">
                        Cairo
                    </option>

                    <option value="Tajawal">
                        Tajawal
                    </option>

                    <option value="Almarai">
                        Almarai
                    </option>

                </select>

            </div>

        </div>

        <button id="createBtn">
            إنشاء الإعلان
        </button>

        <button id="downloadBtn">
            تحميل التصميم
        </button>

    </div>

    <div class="editor" id="capture">

        <div class="glow"></div>

        <img id="previewImage">

        <div class="overlay"></div>

        <div class="badge">
            OFFER
        </div>

        <div class="ad-text" id="adText">
            إعلانك هنا
        </div>

    </div>

</div>

<div class="toast" id="toast">
    تم إنشاء إعلانك بنجاح
</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>

const imageInput =
document.getElementById("imageInput");

const previewImage =
document.getElementById("previewImage");

const textInput =
document.getElementById("textInput");

const adText =
document.getElementById("adText");

const colorPicker =
document.getElementById("colorPicker");

const fontPicker =
document.getElementById("fontPicker");

const toast =
document.getElementById("toast");



imageInput.addEventListener("change",e=>{

    const file = e.target.files[0];

    if(file){

        const reader = new FileReader();

        reader.onload = ev=>{

            previewImage.src = ev.target.result;

        }

        reader.readAsDataURL(file);

    }

});



document.getElementById("createBtn")
.addEventListener("click",()=>{

    adText.innerHTML =
    textInput.value;

    adText.style.color =
    colorPicker.value;

    adText.style.fontFamily =
    fontPicker.value;

    adText.style.animation = "none";

    setTimeout(()=>{

        adText.style.animation =
        "show .7s ease";

    },10);



    toast.classList.add("show");

    setTimeout(()=>{

        toast.classList.remove("show");

    },2500);

});



document.getElementById("downloadBtn")
.addEventListener("click",()=>{

    html2canvas(
    document.getElementById("capture"))
    .then(canvas=>{

        const link =
        document.createElement("a");

        link.download =
        "professional-ad.png";

        link.href =
        canvas.toDataURL();

        link.click();

    });

});

</script>

</body>
</html>
