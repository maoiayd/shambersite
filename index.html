<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Ad Designer</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    background:#0f172a;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow:hidden;
}

.container{
    width:100%;
    max-width:1400px;
    display:grid;
    grid-template-columns:350px 1fr;
    gap:20px;
}

.panel{
    background:#111827;
    padding:25px;
    border-radius:25px;
    color:white;
    box-shadow:0 0 40px rgba(0,0,0,.4);
}

.panel h2{
    margin-bottom:20px;
    font-size:30px;
}

.upload{
    border:2px dashed #374151;
    padding:30px;
    border-radius:20px;
    text-align:center;
    cursor:pointer;
    transition:.3s;
    margin-bottom:20px;
}

.upload:hover{
    background:#1f2937;
}

.upload input{
    display:none;
}

textarea{
    width:100%;
    height:130px;
    border:none;
    outline:none;
    resize:none;
    border-radius:18px;
    padding:15px;
    background:#1f2937;
    color:white;
    font-size:18px;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:18px;
    background:linear-gradient(45deg,#ff0055,#ff7b00);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
}

.editor{
    position:relative;
    height:750px;
    border-radius:30px;
    overflow:hidden;
    background:#111;
    box-shadow:0 0 50px rgba(0,0,0,.5);
}

.editor img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:
    brightness(.75)
    contrast(1.1)
    saturate(1.2);
}

.overlay{
    position:absolute;
    inset:0;
    background:
    linear-gradient(to top,
    rgba(0,0,0,.85),
    rgba(0,0,0,.15)),
    linear-gradient(to right,
    rgba(255,0,85,.25),
    transparent);
    backdrop-filter:blur(1px);
}

.glow{
    position:absolute;
    width:500px;
    height:500px;
    background:#ff0055;
    filter:blur(140px);
    opacity:.25;
    top:-100px;
    left:-100px;
}

.ad-text{
    position:absolute;
    right:60px;
    bottom:60px;
    max-width:70%;
    color:white;
    font-size:55px;
    font-weight:900;
    line-height:1.3;
    cursor:move;
    z-index:5;

    text-shadow:
    0 5px 20px rgba(0,0,0,.7),
    0 0 25px rgba(255,255,255,.15);

    animation:fadeUp .7s ease;
}

.badge{
    position:absolute;
    top:30px;
    left:30px;
    background:linear-gradient(45deg,#ff0055,#ff7b00);
    color:white;
    padding:12px 24px;
    border-radius:50px;
    font-weight:bold;
    z-index:10;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.download{
    margin-top:15px;
    background:linear-gradient(45deg,#00c853,#00e676);
}

@media(max-width:900px){

.container{
    grid-template-columns:1fr;
}

.editor{
    height:500px;
}

.ad-text{
    font-size:35px;
    right:25px;
    bottom:25px;
}

}

</style>
</head>
<body>

<div class="container">

    <div class="panel">

        <h2>مصمم الإعلانات</h2>

        <label class="upload">

            <input type="file" id="imageInput" accept="image/*">

            <h3>ارفع صورة</h3>
            <p>اختار صورة الإعلان</p>

        </label>

        <textarea id="textInput"
        placeholder="اكتب نص العرض هنا..."></textarea>

        <button id="generateBtn">
            إنشاء الإعلان
        </button>

        <button class="download" id="downloadBtn">
            تحميل التصميم
        </button>

    </div>

    <div class="editor" id="capture">

        <div class="glow"></div>

        <img id="image">

        <div class="overlay"></div>

        <div class="badge">
            OFFER
        </div>

        <div class="ad-text" id="adText">
            نص الإعلان
        </div>

    </div>

</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>

const imageInput = document.getElementById("imageInput");
const image = document.getElementById("image");
const textInput = document.getElementById("textInput");
const adText = document.getElementById("adText");

imageInput.addEventListener("change", e=>{

    const file = e.target.files[0];

    if(file){

        const reader = new FileReader();

        reader.onload = ev=>{

            image.src = ev.target.result;

        }

        reader.readAsDataURL(file);

    }

});

document.getElementById("generateBtn")
.addEventListener("click", ()=>{

    adText.innerHTML = textInput.value;

});

document.getElementById("downloadBtn")
.addEventListener("click", ()=>{

    html2canvas(document.getElementById("capture"))
    .then(canvas=>{

        const link = document.createElement("a");

        link.download = "ad-design.png";

        link.href = canvas.toDataURL();

        link.click();

    });

});



/* DRAG TEXT */

let isDragging = false;

let offsetX, offsetY;

adText.addEventListener("mousedown", startDrag);
adText.addEventListener("touchstart", startDrag);

function startDrag(e){

    isDragging = true;

    const rect = adText.getBoundingClientRect();

    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    offsetX = clientX - rect.left;
    offsetY = clientY - rect.top;

}

document.addEventListener("mousemove", drag);
document.addEventListener("touchmove", drag);

function drag(e){

    if(!isDragging) return;

    const editorRect =
    document.querySelector(".editor")
    .getBoundingClientRect();

    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    adText.style.left =
    (clientX - editorRect.left - offsetX) + "px";

    adText.style.top =
    (clientY - editorRect.top - offsetY) + "px";

    adText.style.right = "auto";
    adText.style.bottom = "auto";

}

document.addEventListener("mouseup", ()=>{

    isDragging = false;

});

document.addEventListener("touchend", ()=>{

    isDragging = false;

});

</script>

</body>
</html>
